name: super_pagination_example
description: Feature-first example app demonstrating SuperPagination patterns
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter

  # Super Pagination Library
  super_pagination:
    path: ../
  super_core: ">=1.2.0 <2.0.0"
  super_navigation_sidebar: ^2.3.0

  # For date formatting in grouped messages
  intl: ^0.19.0

  # Navigation
  go_router: ^16.0.0

  # Firebase
  firebase_core: ^3.8.1
  cloud_firestore: ^5.6.0
  firebase_database: ^11.2.0

  # Chat UI enhancements
  tooltip_card: ^2.6.2

  # URL launcher for opening links
  url_launcher: ^6.2.5
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  go_router_builder: ^4.0.1

flutter:
  uses-material-design: true

  # Error illustration images
  assets:
    - assets/images/errors/
